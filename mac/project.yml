name: iTune
options:
  bundleIdPrefix: in.benfranklin
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  iTune:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Generated
        excludes: ["*.a", "*.modulemap"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.benfranklin.itune
        PRODUCT_NAME: iTune
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: Generated/Bridging.h
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/Generated
        OTHER_LDFLAGS: "-litune_core -framework SystemConfiguration -framework Security -framework CoreFoundation"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: App/iTune.entitlements
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        MARKETING_VERSION: "0.2.2"
        CURRENT_PROJECT_VERSION: "3"
        DEAD_CODE_STRIPPING: YES
