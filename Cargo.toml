[workspace]
resolver = "2"
members = ["core", "core/uniffi-bindgen"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev]
debug = 0

[profile.test]
debug = 0

# rquickjs-sys 0.9.0 ships no Android bindings; the aarch64/x86_64 Linux ones are libc-independent (gnu == musl),
# so the vendored copy adds them for *-linux-android.
[patch.crates-io]
rquickjs-sys = { path = "vendor/rquickjs-sys" }
