name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: existing tag to attach builds to (optional)
        required: false
        default: ''
      version_name:
        description: versionName for the Android build (e.g. 0.2.0); empty = 0.1.0-ci.<run>
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked || true
      - name: Native core
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $ANDROID_NDK_HOME"
          bash scripts/build-android-core.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        id: key
        env:
          APP_STORE_PASSWORD: ${{ secrets.APP_STORE_PASSWORD }}
        run: |
          if [ -n "$APP_STORE_PASSWORD" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/keystore/release.p12.enc -out android/keystore/release.p12 -pass env:APP_STORE_PASSWORD
            echo "APP_STORE_PASSWORD=$APP_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "APP_STORE_FILE=$PWD/android/keystore/release.p12" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::APP_STORE_PASSWORD not set; signing with the debug key"
          fi
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version_name }}" ]; then v="${{ inputs.version_name }}"
          else v="0.1.0-ci.${GITHUB_RUN_NUMBER}"; fi
          echo "APP_VERSION_NAME=$v" >> "$GITHUB_ENV"
      - name: Build
        working-directory: android
        run: ./gradlew --stacktrace :app:assembleRelease
      - name: Collect
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/v4-${APP_VERSION_NAME}.apk"
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "out/v4-${APP_VERSION_NAME}.apk" | grep -i sha-256 || true
          rm -f android/keystore/release.p12
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # gating leg: API 34 with the emulator-only flat-glass switch (debug.itune.lite=1; phones never use it).
          # With the full glass, the SwiftShader emulator process itself crashes on the first Home scroll.
          - { api: 34, gpu: swiftshader_indirect, art: smoke, lite: '1' }
          # informational legs (non-gating): full glass via SwiftShader-ANGLE, and API 30
          - { api: 34, gpu: swangle_indirect, art: smoke-swangle }
          - { api: 30, gpu: swiftshader_indirect, art: smoke-api30 }
    continue-on-error: ${{ matrix.art != 'smoke' }}
    env:
      APP_ABIS: arm64-v8a,x86_64
      CORE_ABIS: arm64-v8a x86_64
      APP_VERSION_NAME: 0.0.0-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: smoke
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked || true
      - name: Native core
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          bash scripts/build-android-core.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: android
        run: ./gradlew --stacktrace :app:assembleRelease
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator run
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          ram-size: 4096M
          heap-size: 512M
          cores: 3
          disk-size: 6000M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          script: SMOKE_LITE=${{ matrix.lite || '0' }} bash scripts/smoke-all.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.art }}
          path: out/smoke

  mac:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version_name == '')
    runs-on: macos-26
    timeout-minutes: 75
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mac
          cache-on-failure: true
      - name: Tools
        run: |
          brew install xcodegen
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; elif [ -n "${{ inputs.release_tag }}" ]; then t="${{ inputs.release_tag }}"; v="${t#v}"; else v="0.1.0"; fi
          echo "APP_VERSION_NAME=$v" >> "$GITHUB_ENV"
      - name: Build
        run: bash scripts/build-mac.sh
      - name: Check
        run: |
          hdiutil attach "out/v4-${APP_VERSION_NAME}.dmg" -nobrowse -mountpoint /tmp/v4m
          ls /tmp/v4m
          test -x /tmp/v4m/iTune.app/Contents/MacOS/iTune
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" /tmp/v4m/iTune.app/Contents/Info.plist
          hdiutil detach /tmp/v4m
      - name: Smoke
        run: bash scripts/mac-smoke.sh "out/v4-${APP_VERSION_NAME}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: out/*.dmg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-smoke
          path: out/mac-smoke
      - name: Log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-log
          path: mac/build/xcodebuild.log

  release:
    # Only publish release-signed builds (debug-signed ones can't update an installed app).
    if: always() && (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '') && needs.mac.result == 'success' && needs.android.result == 'success' && needs.smoke.result == 'success'
    needs: [android, mac, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '{android,mac}'
          merge-multiple: true
      - name: Drop debug-signed APK
        if: needs.android.outputs.signed != 'true'
        run: rm -f dist/*.apk
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.release_tag }}"; [ -n "$tag" ] || tag="$GITHUB_REF_NAME"
          v="${tag#v}"
          ls -la dist
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            for f in dist/*; do gh release upload "$tag" "$f" -R "$GITHUB_REPOSITORY" || echo "skip $f (already attached)"; done
          else
            gh release create "$tag" dist/* -R "$GITHUB_REPOSITORY" --title "$v" --notes "$v"
          fi
