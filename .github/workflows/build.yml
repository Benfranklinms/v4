name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked || true
      - name: Native core
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $ANDROID_NDK_HOME"
          bash scripts/build-android-core.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        id: key
        env:
          APP_STORE_PASSWORD: ${{ secrets.APP_STORE_PASSWORD }}
        run: |
          if [ -n "$APP_STORE_PASSWORD" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/keystore/release.p12.enc -out android/keystore/release.p12 -pass env:APP_STORE_PASSWORD
            echo "APP_STORE_PASSWORD=$APP_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "APP_STORE_FILE=$PWD/android/keystore/release.p12" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::APP_STORE_PASSWORD not set; signing with the debug key"
          fi
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.1.0-ci.${GITHUB_RUN_NUMBER}"; fi
          echo "APP_VERSION_NAME=$v" >> "$GITHUB_ENV"
      - name: Build
        working-directory: android
        run: ./gradlew --stacktrace :app:assembleRelease
      - name: Collect
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/v4-${APP_VERSION_NAME}.apk"
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "out/v4-${APP_VERSION_NAME}.apk" | grep -i sha-256 || true
          rm -f android/keystore/release.p12
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  release:
    # Only publish release-signed builds (debug-signed ones can't update an installed app).
    if: startsWith(github.ref, 'refs/tags/v') && needs.android.outputs.signed == 'true'
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          ls -la dist
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            for f in dist/*; do gh release upload "$GITHUB_REF_NAME" "$f" -R "$GITHUB_REPOSITORY" || echo "skip $f (already attached)"; done
          else
            gh release create "$GITHUB_REF_NAME" dist/* -R "$GITHUB_REPOSITORY" --title "$v" --notes "$v"
          fi
